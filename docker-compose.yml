# ReliefLens — whole app.  Ollama runs on the host (not in Docker).
#   docker compose up --build
#   docker compose exec backend python -m app.seed
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - backend-storage:/app/backend/storage

  # Module B adds frontend/Dockerfile. It should serve the built app and proxy /api to backend:8000.
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    profiles: ["full"]   # start with: docker compose --profile full up --build

volumes:
  backend-storage:
